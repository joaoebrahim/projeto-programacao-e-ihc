<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · StudyPlan</title>
    <link rel="icon" href="/projeto-programacao-e-ihc/img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/projeto-programacao-e-ihc/css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <a href="#conteudo" class="visually-hidden-focusable bg-white p-3">Pular para o conteúdo</a>

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/projeto-programacao-e-ihc/">
            <img src="/projeto-programacao-e-ihc/img/logo.svg" alt="" width="32" height="32"> StudyPlan
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link "
                        
                        href="/projeto-programacao-e-ihc/">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link "
                        
                        href="/projeto-programacao-e-ihc/painel">Painel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link "
                        
                        href="/projeto-programacao-e-ihc/materias">Matérias</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link "
                        
                        href="/projeto-programacao-e-ihc/registrar">Registrar estudo</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link "
                        
                        href="/projeto-programacao-e-ihc/sobre">Sobre</a>
                </li>
            </ul>
            <a href="/projeto-programacao-e-ihc/entrar" class="btn btn-primary ms-lg-3 mt-2 mt-lg-0">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar
            </a>
        </div>
    </div>
</nav>

    <main id="conteudo" class="flex-grow-1">
        
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <div class="card p-4">
                    <h1 class="fw-bold mb-1">Entrar</h1>
                    <p class="text-body-secondary mb-4">Acesse o seu plano de estudos.</p>

                    <form action="/projeto-programacao-e-ihc/painel" method="get">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" id="senha" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>

                    <p class="text-center text-body-secondary mt-4 mb-0">
                        Ainda não tem conta? <a href="/projeto-programacao-e-ihc/cadastro">Criar conta</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>

    </main>

    <footer class="bg-dark text-white-50 py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <span>StudyPlan · site open source (licença MIT) · 2026</span>
        <span>Projeto de Programação e IHC · CESMAC</span>
    </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/projeto-programacao-e-ihc/js/script.js"></script>
</body>

</html>
